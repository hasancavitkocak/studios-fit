<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#000000"/>
  
  <!-- Dumbbell Icon -->
  <g transform="translate(400, 200)">
    <!-- Left weight -->
    <rect x="-180" y="-40" width="30" height="80" rx="8" fill="#FFFFFF"/>
    <rect x="-160" y="-50" width="40" height="100" rx="10" fill="#FFFFFF"/>
    
    <!-- Bar -->
    <rect x="-120" y="-10" width="240" height="20" rx="10" fill="#FFFFFF"/>
    
    <!-- Right weight -->
    <rect x="120" y="-50" width="40" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="150" y="-40" width="30" height="80" rx="8" fill="#FFFFFF"/>
  </g>
  
  <!-- Text: STUDIO S-FIT -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">STUDIO S-FIT</text>
  
  <!-- Text: PERSONAL TRAINING -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="42" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">PERSONAL TRAINING</text>
</svg>
