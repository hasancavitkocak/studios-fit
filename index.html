<!doctype html>
<html lang="tr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-nav.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Studio S-Fit | Personal Training</title>
    <meta name="description" content="Kişiye özel antrenman programları ve profesyonel personal training hizmetleri. Studio S-Fit ile hedeflerinize ulaşın." />
    <script>
      // Yönetim paneli (/yonetici) için uygulama ayarları. Sayfa çizilmeden önce eklenmeli:
      // sonradan eklenirse iPhone ilk açılışta yerleşimi kaydırıyor.
      if (location.pathname.indexOf('/yonetici') === 0) {
        document
          .querySelector('meta[name="viewport"]')
          .setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover')
        ;[
          ['link', { rel: 'manifest', href: '/yonetici.webmanifest' }],
          ['link', { rel: 'apple-touch-icon', href: '/icons/apple-touch-icon.png' }],
          ['meta', { name: 'theme-color', content: '#09090b' }],
          ['meta', { name: 'apple-mobile-web-app-capable', content: 'yes' }],
          ['meta', { name: 'mobile-web-app-capable', content: 'yes' }],
          ['meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black' }],
          ['meta', { name: 'apple-mobile-web-app-title', content: 'S-Fit' }],
        ].forEach(function (item) {
          var el = document.createElement(item[0])
          for (var k in item[1]) el.setAttribute(k, item[1][k])
          document.head.appendChild(el)
        })
      }
    </script>
  </head>
  <body translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
